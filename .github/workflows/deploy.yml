name: Deploy

# Every push to main builds the site and publishes dist/ to the gh-pages
# branch, which GitHub Pages serves at https://plugin.codazo.io/. The
# gh-pages branch is a build artifact and is replaced on each deploy.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run ci
      - name: Publish dist/ to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && touch .nojekyll
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Build ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
