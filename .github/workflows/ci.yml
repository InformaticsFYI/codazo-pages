name: CI

# Every pull request and every push to main: Astro check, tests, and a build.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run ci
      - name: The build keeps the custom domain and root-relative assets
        run: |
          test "$(cat dist/CNAME)" = "plugin.codazo.io"
          grep -q 'href="/_astro/' dist/index.html
